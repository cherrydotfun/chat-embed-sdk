<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cherry Embed — themable demo</title>
    <link rel="icon" type="image/png" href="%BASE_URL%cherry-logo.png" />
    <meta
      name="description"
      content="Drop-in chat widget for any website. Themable in real time, wallet sign-in handled inside the iframe — no backend required."
    />
    <!-- Brand fonts for the theme presets. Inter (Jupiter) + Outfit (Cherry
         set) come from Google Fonts; Solflare's FK Grotesk is self-hosted via
         @font-face in styles.css. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Loaded from {base}/cherry-embed.js — Vite middleware in dev, server.js in prod.
         %BASE_URL% is substituted by Vite at build/dev time so the path stays correct
         under both root mounts and sub-path deploys (e.g. /chat-embed-example/). -->
    <script src="%BASE_URL%cherry-embed.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
